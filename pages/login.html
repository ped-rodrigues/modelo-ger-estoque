<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaisen | Acesso de funcionários</title>
  <link rel="stylesheet" href="../css/fontes.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body class="pagina-login">
  <a class="pular-para-conteudo" href="#conteudo">Pular para o conteúdo</a>

  <main class="login" id="conteudo">
    <section class="login__cartao" aria-labelledby="titulo-login">

      <div class="login__boasvindas">
        <a class="login__marca" href="../index.html" aria-label="Kaisen — página inicial">
          <picture><source media="(max-width: 1060px)" srcset="../assets/logo-login-mobile.png"><img src="../assets/logo-login.png" alt=""></picture>
          <span aria-hidden="true">Kaisen</span>
        </a>
        <h1 id="titulo-login">
          <span class="login__ola">HELLO,</span>
          <span class="login__welcome">WELCOME !</span>
        </h1>
        <p class="login__sub">You can sign in to access with your<br> existing account</p>
      </div>

      <div class="login__painel">
        <div id="mensagem-login" role="status" aria-live="polite" hidden></div>

        <form id="form-login" novalidate>
          <div class="login__campo">
            <label for="login-usuario">Email address</label>
            <span class="login__erro" id="erro-login-usuario" data-erro-de="usuario"></span>
            <input type="text" id="login-usuario" name="usuario" maxlength="40"
                   placeholder="KaisenTeste@gmail.com" autocomplete="username" spellcheck="false"
                   autofocus aria-describedby="erro-login-usuario" aria-invalid="false">
          </div>

          <div class="login__campo">
            <label for="login-senha">Password</label>
            <span class="login__erro" id="erro-login-senha" data-erro-de="senha"></span>
            <input type="password" id="login-senha" name="senha" maxlength="40"
                   placeholder="***************" autocomplete="current-password"
                   aria-describedby="erro-login-senha" aria-invalid="false">
          </div>

          <div class="login__opcoes">
            <label class="login__lembrar">
              <input type="checkbox" name="lembrar"> Remember me
            </label>
            <a href="#" id="link-senha">Forgot password?</a>
          </div>

          <!-- Seção 1.8 do Documento de Visão: dois perfis. Sem autenticação real, o perfil é escolhido aqui. -->
          <fieldset class="login__perfil">
            <legend>Sign in as</legend>
            <label><input type="radio" name="perfil" value="ADM" checked> Administrador</label>
            <label><input type="radio" name="perfil" value="OPR"> Funcionário</label>
          </fieldset>

          <div class="login__botoes">
            <button type="submit" class="login__entrar">Login</button>
            <a href="#" class="login__cadastro" id="link-cadastro">Sign up</a>
          </div>
        </form>

        <p class="login__seguir">
          <span>follow</span>
          <a href="https://www.instagram.com/" aria-label="Instagram"><img class="login__instagram" src="../assets/instagram.png" alt=""></a>
          <a href="https://twitter.com/" aria-label="Twitter"><img class="login__twitter" src="../assets/twitter.png" alt=""></a>
          <a href="https://www.facebook.com/" aria-label="Facebook"><img class="login__facebook" src="../assets/facebook.png" alt=""></a>
        </p>
      </div>
    </section>
  </main>

  <!-- A ordem importa: quem é usado vem antes de quem usa. -->
  <script src="../js/storage.js"></script>
  <script src="../js/estoque.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
